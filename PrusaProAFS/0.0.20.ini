printer_notes = Do not remove the keywords below.\nPRINTER_VENDOR_PRUSA3D\nPRINTER_MODEL_iX\nPG\nAFS\nNO_TEMPLATES
retract_lift_below = 174
retract_speed = 35
deretract_speed = 25
retract_before_travel = 1.5
retract_before_wipe = 80%
retract_layer_change = 1
retract_length = 0.7
retract_length_toolchange = 0
start_gcode = ;--- verze -> cistitak V3 - silicon, PM\n;--- verze -> s rammingem\n;--- verze -> FW 6.3.0\n;--- pouzivani G28 - s vyhnutim se cistitku\n;--- G27 - parking pozition\nM17 ; enable steppers\nM862.3 P "[printer_model]" ; printer model check\nM862.1 P[nozzle_diameter] ; nozzle diameter check\n\n;--- METRIC SECTION\nM330 SYSLOG\nM331 loadcell\nM331 loadcell_threshold\nM331 loadcell_hysteresis\nM331 loadcell_scale\nM331 probe_z\nM331 probe_z_raw\nM331 probe_z_diff\nM331 home_diff\nM331 fsensor_raw\nM331 temp_hbr\nM331 temp_bed\nM331 temp_noz\nM331 temp_brd\nM331 ttemp_bed\nM331 ttemp_noz\nM331 pos_z\nM331 fan_speed\nM331 fan_hbr_speed\nM331 tmc_sg_x\nM331 tmc_sg_y\nM331 tmc_sg_z\nM331 tmc_sg_e\nM331 bedlet_temp\nM331 bedlet_target\nM331 bedlet_pwm\nM331 bed_curr\nM331 bedlet_state\nM331 bedlet_curr\nM331 bedlet_target\nM331 bed_state\nM331 fsensor\n;--- END OF METRIC SECTION\nM555 X{(min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)} Y{(max(0, first_layer_print_min[1]) - 4)} W{((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) - ((min(print_bed_max[0], first_layer_print_min[0] + 32) - 32))} H{((first_layer_print_max[1])) - ((max(0, first_layer_print_min[1]) - 4))}\nG90 ; use absolute coordinates\nM83 ; extruder relative mode\nM142 S{(filament_type[0] == "PC") ? 80 : (filament_type[0] == "ASA") ? 80 : (filament_type[0]=~/.*PET.*/) ? 60 : (filament_type[0] == "PLA") ? 45 : 45} ; set Heatbreak temp\nM140 S[first_layer_bed_temperature] ; set bed temp\n\nM104 S150 ;Heat for home\nM84 E ; turn off E motor\nM569 S0 X Y ; silent mode off\nG28 XY; Home\nG27 P4 ;Park\nM109 T0 R{first_layer_temperature[0]} ;Heat up to print temp\n\n;--- Unpark\nG1 X208.75 Y295 F5000 ;A2\n;---\n;-- Purge Position\nG1 X267.4 Y305 F5000\n;--\n;-- Purge and ramp\nM591 S0 ; disable stuck filament detection\nM106 S60 ; fan on\nG1 E20 F250\nG92 E0 ; Reset extruder position to 0\n;-- Purge Position\nG1 X267.4 Y305 F5000\nG1 E10 F900\nG1 E-20 F6000\n;Wait for 3 seconds\nG4 S3\nM106 S0 ; fan off\n;-- Cut filament\nG1 X267,4 Y284.75 F4000 ;C3\nG1 X253.4 Y284.75 F4000 ;C1\nG1 X267,4 Y284.75 F4000 ;C3\nG1 X253.4 Y284.75 F4000 ;C1\nG1 X267,4 Y284.75 F4000 ;C3\nG1 X253.4 Y284.75 F4000 ;C1\n;--- cleaning seq.\n;->G12\nG1 X222.49 Y303.28 F5000 ;B8\nG1 X240.88 Y284.89 F4000 ;B1\nG1 X243.2 Y296.12 ;B6\nG1 X232.48 Y285.4 ;B2\nG1 X238.46 Y300.86 ;B7\nG1 X227.74 Y290.14 ;B4\nG1 X233.72 Y305.6 ;B9\nG1 X223 Y294.88 ;B5\nG1 X238.46 Y300.86 ;B7\nG1 X227.74 Y290.14 ;B4\nG1 X243.2 Y296.12 ;B6\nG1 X243.71 Y287.72 ;B3\nG1 X225.32 Y306.11 ;B10\nG1 X227.74 Y290.14 ;B4\nG1 X233.72 Y305.6 ;B9\nG1 X240.88 Y284.89 ;B1\n;--- end of cleaning seq.\n;--- Cool extruder and wait\nG27 P4 ;parking pozition\nM106 S80 ; fan on\nM109 T0 R{((filament_notes[0]=~/.*HT_MBL10.*/) ? (first_layer_temperature[0] - 10) : (filament_type[0] == "PC" or filament_type[0] == "PA") ? (first_layer_temperature[0] - 25) : (filament_type[0] == "FLEX") ? 210 : (filament_type[0]=~/.*PET.*/) ? 175 : 170)} ; wait for temp\nM106 S0 ; fan off\nM142 S{(filament_type[0] == "PC") ? 80 : (filament_type[0] == "ASA") ? 80 : (filament_type[0]=~/.*PET.*/) ? 60 : (filament_type[0] == "PLA") ? 45 : 45} ; set Heatbreak temp\nM84 E ; turn off E motor\n;--- nozzle cleaning / cleaning check - standard MK4\n;park out\nG1 X208.75 Y295 F2000 ;A2\nG28 Z ; home Z\nG1 X260 Y260 Z5 F5000\nG29 P9 X228 Y260 W32 H4\nG27 P4 ;parking pozition\n\n{if first_layer_bed_temperature[initial_tool]<=60}M106 S100{endif}\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM107\n;---\n;park out\nG1 X208.75 Y295 F2000 ;A2\n;---\n;\n; MBL\n;\nM84 E ; turn off E motor\nG29 P1 ; invalidate mbl & probe print area\nG29 P1 X216 Y245 W50 H20 C ; probe near purge place\nG29 P3.2 ; interpolate mbl probes\nG29 P3.13 ; extrapolate mbl outside probe area\nG29 A ; activate mbl\nG27 P4 ;parking pozition\n; prepare for purge\nM104 S{first_layer_temperature[0]}\nM109 S{first_layer_temperature[0]}\nG92 E0\nM73 P25 R0\nM106 P0 S0\nG1 X244.6 Y272.21 F4000\nM73 P26 R0\nG1 X260 Y263 F4000 ; move away and ready for the purge\n;---\nM569 S0 E ; set spreadcycle mode for extruder\n;\n; Extrude purge line\n;\nG92 E0 ; reset extruder position\nG1 Z.8 E18 F600 ;\nM73 P27 R0\nG0 E6 X240 Z0.2 F800 ; purge\nG0 X230 E8 Z7.2 F300 ; purge\nM73 P30 R0\nG0 X220 E4 Z0.2 F500 ; purge\nM73 P32 R0\nG0 X210 E4 F700 ; purge\nM73 P33 R0\nG0 X190 E8 F1000 ; purge\nG0 X185 Z0.05 F8000 ; wipe, move close to the bed\nM73 P34 R0\nG0 X183 Z0.2 F8000 ; wipe, move quickly away from the bed\nG92 E0 ; reset extruder position\nM591 R ; Enable stuck filament\nM221 S100 ; set flow to 100%
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0.0\n;[layer_z]
