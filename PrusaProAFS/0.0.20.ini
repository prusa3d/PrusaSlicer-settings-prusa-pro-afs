[printer:*iX*]
bed_shape = 0x0,260x0,260x260,0x260
max_print_height = 175 
printer_variant = 0.4
printer_model = iX
nozzle_diameter = 0.4
end_gcode = ;---\nG1 E-9 F3000 ; retract\n{if layer_z < max_print_height}G1 Z{z_offset+min(layer_z+5, max_print_height)} F2000 ; Move print head up{endif}\n;---\n\n;--- standart\n;{if layer_z < max_print_height}G1 Z{z_offset+min(layer_z+1, max_print_height)} F720 ; Move print head up{endif}\n\nM104 S0 ; turn off temperature\nM107 ; turn off fan\n\n;--- END MOVEMENT G-CODE\nM591 S0 ; disable stuck filament detection\nG1 X267.4 Y273.01 F10000 ;C4\nG1 X267,4 Y305  \nG4 ; wait\n;--- nozzle emptying\nM106 P0 S204\nG1 E10 F300\nG1 E10 F900\nG1 E-20 F6000\nG4 ; wait\n;--- move through V-BLADE \n\nG1 X267,4 Y284.75  ;C3\n\nG1 X253.4 Y284.75 F1000 ;C1\n\nG1 X267,4 Y284.75 F3000 ;C3\n\nG1 X253.4 Y284.75 F3000 ;C1\n\nG1 X267,4 Y284.75 F3000 ;C3\n\nG1 X253.4 Y284.75 F3000 ;C1\n;---\nM106 P0 S0\n\n;--- cleaning seq. same as in start g-code\n;->G12\nG1 X222.49 Y303.28 F5000 ;B8\nG1 X240.88 Y284.89 F4000 ;B1\nG1 X243.2 Y296.12  ;B6\nG1 X232.48 Y285.4  ;B2\nG1 X238.46 Y300.86  ;B7\nG1 X227.74 Y290.14  ;B4\nG1 X233.72 Y305.6  ;B9\nG1 X223 Y294.88  ;B5\nG1 X238.46 Y300.86  ;B7\nG1 X227.74 Y290.14  ;B4\nG1 X243.2 Y296.12  ;B6\nG1 X243.71 Y287.72  ;B3\nG1 X225.32 Y306.11  ;B10\nG1 X227.74 Y290.14  ;B4\nG1 X233.72 Y305.6  ;B9\nG1 X240.88 Y284.89  ;B1\n;--- end of cleaning seq.\nG1 X229 Y273 F12000\n\n\nG27 P4  ; parking position\n\n{if layer_z < max_print_height}G1 Z{max_print_height} F700 ; Move print head up{endif}\n\nG4 ; wait\nM221 S100 ; reset flow\nM900 K0 ; reset LA\nM572 S0 ; reset PA\nM84 X Y E ; disable motors\n; max_layer_z = [max_layer_z]
silent_mode = 0
machine_limits_usage = emit_to_gcode
machine_max_acceleration_e = 2500,2500
machine_max_acceleration_extruding = 7000,7000
machine_max_acceleration_retracting = 4000,4000
machine_max_acceleration_travel = 7000,7000
machine_max_acceleration_x = 7000,7000
machine_max_acceleration_y = 7000,7000
