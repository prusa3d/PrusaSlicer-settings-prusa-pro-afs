filament_abrasive = 1
filament_colour = #a9a9a9	
extrusion_multiplier = 1.04
first_layer_temperature = 285
temperature = 285
bed_temperature = 115
min_fan_speed = 20
max_fan_speed = 30
bridge_fan_speed = 30
slowdown_below_layer_time = 18
filament_max_volumetric_speed = 9
filament_cost = 90.73
filament_spool_weight = 193
filament_vendor = Prusa Polymers
start_filament_gcode = "M572 S{if nozzle_diameter[0]==0.4}0.05{elsif nozzle_diameter[0]==0.5}0.035{elsif nozzle_diameter[0]==0.6}0.025{elsif nozzle_diameter[0]==0.8}0.016{elsif nozzle_diameter[0]==0.25}0.14{elsif nozzle_diameter[0]==0.3}0.09{else}0{endif} ; Filament gcode \n M142 S65 ; set heatbreak temp"
compatible_printers_condition = printer_notes=~/.*AFS.*/ and nozzle_diameter[0]==0.4

