# Print profiles for Prusa Research printers.

[vendor]
repo_id = prusa-pro-afs
name = Prusa Pro AFS
config_version = 0.0.2

# The printer models will be shown by the Configuration Wizard in this order,
# also the first model installed & the first nozzle installed will be activated after install.
# Printer model name will be shown by the installation wizard.

[printer_model:iX]
name = TEST - Prusa iX - TEST
variants = 0.4
technology = FFF
family = Prusa Pro AFS
bed_model = afs_bed.stl
bed_texture = afs.svg
thumbnail = AFS_temp_thumbnail.png
default_materials = Generic PLA @AFS; Generic ABS @AFS; Generic PETG @AFS; Prusament PLA @AFS; Prusament rPLA @AFS; Prusament PLA Blend @AFS; Prusament PETG @AFS; Prusament ASA @AFS; Prusament PC Blend @AFS; Prusament PC Blend Carbon Fiber @AFS; Prusament PVB @AFS; Prusament PA11 Carbon Fiber @AFS

# All presets starting with asterisk, for example *common*, are intermediate and they will
# not make it into the user interface.

